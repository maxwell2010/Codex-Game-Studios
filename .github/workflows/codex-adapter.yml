name: Codex adapter
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: python tools/audit_codex.py
      - run: python -m unittest discover -s tests -v
      - run: git diff --exit-code -- .agents .codex
      - run: python tools/fetch_test_engine.py
      - if: runner.os == 'Windows'
        run: python tools/run_studio_cycle.py --godot .scratch/test-engine/Godot_v4.5.1-stable_win64.exe --bash "C:\Program Files\Git\bin\bash.exe"
      - if: runner.os == 'Linux'
        run: xvfb-run -a python tools/run_studio_cycle.py --godot .scratch/test-engine/Godot_v4.5.1-stable_linux.x86_64 --render
